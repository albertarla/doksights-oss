name: CI — Run Tests

# Runs on every push to main and on every pull request
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # ============================================================
  # Job 0: Secret scan (fails the build if a key is committed)
  # ============================================================
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  # ============================================================
  # Job 1: Backend Python tests (runs in Docker, same as local)
  # ============================================================
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t doksights_api:latest ./backend

      - name: Run pytest inside the container
        run: |
          docker run --rm \
            -e SUPABASE_URL=http://localhost:54321 \
            -e SUPABASE_SERVICE_KEY=mock_service_key_for_ci \
            -e SUPABASE_JWT_SECRET=mock_jwt_secret_for_ci_at_least_32_characters_long \
            -e AI_PROVIDER=test \
            -e GOOGLE_API_KEY=mock \
            -e OPENAI_API_KEY=mock \
            -e ENVIRONMENT=development \
            doksights_api:latest \
            bash -c "cd /backend && python -m pytest tests/ -v --tb=short"

  # ============================================================
  # Job 2: Frontend Vitest unit tests (no Docker needed)
  # ============================================================
  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache npm dependencies to speed up subsequent runs
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run unit tests
        run: npm run test
        working-directory: frontend

  # ============================================================
  # Job 3: Frontend build check (catches TypeScript/build errors)
  # ============================================================
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build production bundle
        # Uses dummy env vars — the build just needs them to be defined at compile time.
        # VITE_* vars are baked in at build time; mocks are sufficient for a type/build check.
        env:
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: mock_publishable_key
          VITE_SUPABASE_PROJECT_ID: mock_project_id
          VITE_API_URL: https://mock-api.example.com/api/v1
        run: npm run build
        working-directory: frontend
